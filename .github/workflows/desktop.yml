name: Desktop baseline

on:
  pull_request:
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.25.5"
          cache-dependency-path: apps/core/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm types:desktop
      - run: pnpm test:desktop
      - run: pnpm unused
      - run: pnpm build:windows
      - run: pnpm smoke:desktop
        env:
          DISKPOND_TEST_TMP: ${{ runner.temp }}
      - run: pnpm smoke:desktop --dev
        env:
          DISKPOND_TEST_TMP: ${{ runner.temp }}
      - run: pnpm smoke:windows
        env:
          DISKPOND_TEST_TMP: ${{ runner.temp }}
