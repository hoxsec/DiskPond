name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/desktop.yml
  publish:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete release, add source and checksums
        run: node scripts/release-assets.mjs finalize
      - name: Publish checked assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:GH_REPO -cne 'hoxsec/DiskPond') { throw 'Unexpected release repository' }
          $prerelease = $env:RELEASE_TAG.Contains('-')
          $latest = -not $prerelease
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "DiskPond $env:RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.txt
          gh release upload $env:RELEASE_TAG (Get-ChildItem release-assets -File).FullName
          gh release edit $env:RELEASE_TAG --draft=false "--prerelease=$($prerelease.ToString().ToLowerInvariant())" "--latest=$($latest.ToString().ToLowerInvariant())"
